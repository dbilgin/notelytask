name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p assets/env
          printf '%s' "$ENV_FILE" > assets/env/notelytask.env

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable
          version: 3.44.1

      - name: Install dependencies
        run: flutter pub get

      - name: Apply patches
        run: dart tool/apply_patches.dart

      - name: Run Flutter Analyzer
        run: flutter analyze

  build-linux:
    needs: analyze
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p assets/env
          printf '%s' "$ENV_FILE" > assets/env/notelytask.env

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME:-1.0.0}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Update debian version
        run: |
          sed -i "s/Version: .*/Version: ${{ steps.version.outputs.VERSION }}/" debian/debian.yaml

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev rpm

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable
          version: 3.44.1

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Apply patches
        run: dart tool/apply_patches.dart

      - name: Build Linux release
        run: flutter build linux --release

      - name: Install flutter_to_debian
        run: dart pub global activate flutter_to_debian

      - name: Build .deb package
        run: flutter_to_debian

      - name: Fix .deb permissions
        run: chmod 644 build/linux/x64/release/debian/*.deb

      - name: Create RPM build structure
        run: |
          RPM_ROOT="$GITHUB_WORKSPACE/rpmbuild"
          SOURCE_DIR="${RPM_ROOT}/SOURCES/notelytask"

          mkdir -p "${RPM_ROOT}/BUILD" "${RPM_ROOT}/BUILDROOT" "${RPM_ROOT}/RPMS" "${RPM_ROOT}/SOURCES" "${RPM_ROOT}/SPECS" "${RPM_ROOT}/SRPMS"
          rm -rf "${SOURCE_DIR}"
          mkdir -p "${SOURCE_DIR}/bundle" "${SOURCE_DIR}/desktop" "${SOURCE_DIR}/pixmaps"

          cp -r build/linux/x64/release/bundle/* "${SOURCE_DIR}/bundle/"
          chmod +x "${SOURCE_DIR}/bundle/notelytask"
          cp assets/icon.png "${SOURCE_DIR}/pixmaps/notelytask.png"

          printf "[Desktop Entry]\nName=NotelyTask\nComment=Task management app\nExec=/opt/notelytask/notelytask\nIcon=notelytask\nType=Application\nCategories=Office;Utility;\n" > "${SOURCE_DIR}/desktop/notelytask.desktop"
          chmod 644 "${SOURCE_DIR}/desktop/notelytask.desktop"

      - name: Build .rpm package
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          RPM_ROOT="$GITHUB_WORKSPACE/rpmbuild"

          cat > "${RPM_ROOT}/SPECS/notelytask.spec" <<EOF
          Name:           notelytask
          Version:        ${VERSION}
          Release:        1%{?dist}
          Summary:        Task management app
          License:        MIT
          URL:            https://github.com/${{ github.repository }}
          BuildArch:      x86_64
          Requires:       gtk3

          %description
          NotelyTask is a task management application built with Flutter.

          %install
          mkdir -p %{buildroot}/opt/notelytask
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/pixmaps
          cp -a %{_sourcedir}/notelytask/bundle/. %{buildroot}/opt/notelytask/
          chmod 755 %{buildroot}/opt/notelytask/notelytask
          ln -s /opt/notelytask/notelytask %{buildroot}/usr/bin/notelytask
          install -m 644 %{_sourcedir}/notelytask/desktop/notelytask.desktop %{buildroot}/usr/share/applications/notelytask.desktop
          install -m 644 %{_sourcedir}/notelytask/pixmaps/notelytask.png %{buildroot}/usr/share/pixmaps/notelytask.png

          %files
          /opt/notelytask
          /usr/bin/notelytask
          /usr/share/applications/notelytask.desktop
          /usr/share/pixmaps/notelytask.png
          EOF

          rpmbuild -bb "${RPM_ROOT}/SPECS/notelytask.spec" \
            --define "_topdir ${RPM_ROOT}" \
            --define "_build_id_links none"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: build/linux/x64/release/debian/notelytask_${{ steps.version.outputs.VERSION }}_amd64.deb

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: rpmbuild/RPMS/x86_64/notelytask-${{ steps.version.outputs.VERSION }}-1.x86_64.rpm

  build-android:
    needs: analyze
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for git rev-list --count

      - name: Create env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p assets/env
          printf '%s' "$ENV_FILE" > assets/env/notelytask.env

      - name: Setup Android signing
        run: |
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/app/key.properties
          echo "${{ secrets.ANDROID_RELEASE_KEY }}" | base64 --decode > android/app/notely.keystore

      - name: Extract version and build number
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME:-1.0.0}
          BUILD_NUMBER=$(git rev-list --count HEAD || echo "1")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION ($BUILD_NUMBER)"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable
          version: 3.44.1

      - name: Install dependencies
        run: flutter pub get

      - name: Apply patches
        run: dart tool/apply_patches.dart

      - name: Build APK
        run: flutter build apk --release --build-name=${{ steps.version.outputs.VERSION }} --build-number=${{ steps.version.outputs.BUILD_NUMBER }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Create web client configuration
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          test -n "$ENV_FILE" || { echo 'ENV_FILE secret is required'; exit 1; }
          mkdir -p assets/env
          printf '%s' "$ENV_FILE" > assets/env/notelytask.env

      - uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable
          version: 3.44.1

      - run: flutter pub get
      - run: dart tool/apply_patches.dart
      - run: flutter build web --release

      - name: Stamp release and prepare image name
        id: image
        run: |
          printf '%s' "$GITHUB_SHA" > build/web/release.txt
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish web image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}

  deploy-web:
    needs: [build-web, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: dokploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Roll out released image to Dokploy
        env:
          DOKPLOY_URL: https://app.omedacore.com
          DOKPLOY_APPLICATION_ID: mZljy1-ubEsA4KJ_x4WzG
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          WEB_IMAGE: ${{ needs.build-web.outputs.image }}
        run: bash deploy/deploy-dokploy.sh

  create-release:
    needs: [build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

  upload-downloads:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: sftpgo-notelytask-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: release-packages
      - uses: actions/download-artifact@v4
        with:
          name: linux-rpm
          path: release-packages
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-packages

      - name: Install HTTP client
        run: sudo apt-get update && sudo apt-get install -y python3-requests

      - name: Replace NotelyTask downloads
        env:
          SFTPGO_API_KEY: ${{ secrets.SFTPGO_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SFTPGO_API_KEY" || { echo 'SFTPGO_API_KEY secret is required'; exit 1; }
          mv release-packages/app-release.apk "release-packages/notelytask_${GITHUB_REF_NAME}.apk"
          /usr/bin/python3 deploy/upload-release.py release-packages/*
